                    <h2>Pre-Call Research</h2>
                    <p>The purpose of pre-call research is to build an agenda so that you sound prepared for your call with the mx. It’s also important to be efficient with your pre-call research time. You do not want to spend 10 minutes researching an account, just for the DM to not answer. A reasonable amount of time for pre-call research is between 2-3 minutes. Here are the most common things you should research within that time frame to ensure that you are prepared for the call.</p>
                    <h3><u>Time Zones:</u></h3>
                    <p>Please check the time zone the merchant is in, and compare it to your time zone in CR. This will allow you to ensure that you’re calling during the appropriate business hours which are correlated with the most DM connects.</p>
                    <h3><u>Opportunity Size:</u></h3>
                    <p>Sorting your BoB by opportunity size will allow you to measure which merchants <em>could</em> have the biggest potential impact on your quota. This can be especially effective if you are behind in certain buckets and you want to target the area that you have fallen behind in. Once you pull up your BoB, please look for the following columns:</p>
                    <ul>
                        <li>SL_OPP - 
                            <ul style="list-style-type: circle; padding-left: 1.5rem; margin-top: 0.2rem;">
                                <li>This is a binary 1/0 where a 0 means there is no ads opportunity (there is already an active ad on the store) and 1 means there is an open opportunity</li>
                            </ul>
                        </li>
                        <li style="margin-top: 0.5rem;">PROMO_OPP - 
                            <ul style="list-style-type: circle; padding-left: 1.5rem; margin-top: 0.2rem;">
                                <li>This is a binary 1/0 where a 0 means there is no promo opportunity (there is already an active promo on the store) and 1 means there is an open opportunity</li>
                            </ul>
                        </li>
                    </ul>
                    <h3><u>Identifying the DM’s Contact Info:</u></h3>
                    <p>The DM’s name and direct number are listed directly in your BoB / Lead List. It is important to note that the phone number field may be missing. As a best practice, please search for other Contacts listed in SFDC. Other areas to search for contacts:</p>
                    <ul>
                        <li>MXP Cases</li>
                        <li>Merchant Portal</li>
                        <li>Google</li>
                        <li>AskDataAI</li>
                    </ul>
                    <h3><u>Campaign Reporting:</u></h3>
                    <p>Best used to see current marketing performance and validate A&P opportunity size. Please keep in mind, the Sigma that your BoB lives on is <u>only updated once per week</u>. It’s important that you review the Campaign Reporting tab prior to making assumptions regarding a Mx’s existing campaigns. In addition, this tab allows you to:</p>

                content: `
                    <h2>QA Scorecards</h2>
                    <p>Our QA scoring model was created to reflect our current sales process.</p>
                    <p>Here is the full scorecard: <span style="color: #ff3008; font-weight: bold; text-decoration: underline;">Mx Success Graded QA Scorecard</span></p>
                    <h3>Drivers</h3>
                    <p>Each step of the sales process has a different “driver”. Each driver contains a thorough description that allows the QA associate evaluating the call to make an accurate assessment of the seller's ability to execute each step in a live call scenario.</p>
                    <h3>Ratings</h3>
                    <p>We opted to utilize a 2-3 tier scoring model vs a sliding scale of 1-10. This was done in an effort to simplify the rating process and minimize variance of QA associates with various levels of experience. You will notice that most sections only have 2 options (Y/N), while others such as “Discovery” may have all 3, allowing room for a partial crediting system. This is due to the fact that Discovery is not black and white, it is a very nuanced part of the sales process that should be evaluated as such. Here is the 3 tier scoring model, as shown in the QA Form:</p>
                    <p style="margin-left: 1rem; font-weight: 600;">
                        <span style="color: #dc2626;">Did not demonstrate</span> | 
                        <span style="color: #d97706;">Partially Demonstrated</span> | 
                        <span style="color: #16a34a;">Effectively Demonstrated</span>
                    </p>
                    <h3>Points</h3>
                    <p>Our point system was created primarily based on the importance of each step in relation to the overall sales process. There are, however, other factors considered. Such as:</p>
                    <ol style="list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.5rem;">
                        <li><strong>Difficulty level to implement</strong> - The more challenging a step is to perform, the more points we (sometimes) allocate.</li>
                        <li style="margin-top: 0.5rem;"><strong>Bad sales practices</strong> - On the contrary, bad sales practices are easy to execute. However, they are bad for the mx and/or DoorDash. Thus, we sometimes allocate more points here, to deter bad behavior. In some cases, leading up to ZTP (Zero Tolerance Policy).</li>
                    </ol>
                    <h2 style="color: #ff3008;">Zero Tolerance Policy (ZTP)</h2>
                    <p>We uncovered a few errors in the sales process that were so common amongst mid-bottom performers that a mere 5 or 10 point deduction were not enough to deter it. Thus, we implemented the use of a ZTP, as a strict method of curbing bad behavior. If a rep violates a ZTP, they will receive an automatic 0 on their QA scorecard, which can oftentimes impact their compensation on the BPO side. However, reps do not receive additional points if they <em>don’t</em> violate the ZTP. It is looked at as a minimum expectation of the job, not extra credit.</p>
                `
            },

                content: `
                    <h2>Logging Calls in Outreach</h2>

                    <h3>Legend</h3>
                    <ul style="list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem;">
                        <li>The large squares represent the <strong><em>Call Purpose</em></strong>. If it is outlined in <span style="color: red; font-weight: 600;">red</span> = never used. If it is outlined in <span style="color: orange; font-weight: 600;">orange</span> = occasionally used. If it is outlined in <span style="color: green; font-weight: 600;">green</span> = frequently used.</li>

                    <h2>CW Validation (Sales Crediting)</h2>

                                    <ul style="list-style-type: square; padding-left: 1.5rem; margin-top: 0.25rem;">
                                        <li><strong>A net new store count</strong> is defined as a store that is:
                                            <ul style="list-style-type: circle; padding-left: 1.5rem; margin-top: 0.1rem;">

                                                <li>On Ads at the end of the quarter</li>

                                        <li style="margin-top: 0.5rem;">Following scenarios define store count:
                                            <ul style="list-style-type: circle; padding-left: 1.5rem; margin-top: 0.1rem;">
                                                <li>If a store gets signed up on Ads in <strong>the quarter</strong> and doesn’t churn in <strong>by end of quarter</strong>, that counts as 1 net new store</li>
                                                <li>If a store gets signed up on Ads in <strong>quarter</strong> and churns in <strong>the same quarter</strong>, that counts as 0 net new store</li>

                                                <li>If a store gets signed up on Ads in <strong>quarter</strong> and churns in <strong>the same quarter</strong>, and gets signed up again in <strong>the same quarter</strong>, that counts as 1 net new store</li>

                    <h2>Texting Policy</h2>
                    <h3>Can I Text Merchants Through Outreach?</h3>
                    <p>Generally speaking no, unless under one of the following circumstances:</p>
                    <ol style="list-style-type: decimal; padding-left: 1.5rem;">
                        <li>Only when the Mx has explicitly consented to receive a text message from DoorDash in writing.</li>

        // ENGINE RUNTIME CONTROL LAYER
        const sidebar = document.getElementById('sidebar');
        const contentView = document.getElementById('content-view');
        const searchBar = document.getElementById('search-bar');

        function renderSidebar(articles) {
            sidebar.innerHTML = '';
            const categories = {};
            
            articles.forEach(article => {
                if (!categories[article.category]) {
                    categories[article.category] = [];
                }
                categories[article.category].push(article);
            });

            const sortedCategories = Object.keys(categories).sort();

            sortedCategories.forEach(category => {
                const group = document.createElement('div');
                group.className = 'category-group';

                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = category;
                group.appendChild(catTitle);

                categories[category].forEach(article => {
                    const link = document.createElement('a');
                    link.className = 'article-link';
                    link.textContent = article.title;
                    link.dataset.id = article.id;
                    link.title = article.title;
                    link.addEventListener('click', () => displayArticle(article.id));
                    group.appendChild(link);
                });

                sidebar.appendChild(group);
            });
        }

        function displayArticle(id) {
            const article = kbData.find(a => a.id === id);
            if (!article) return;

            document.querySelectorAll('.article-link').forEach(link => {
                link.classList.toggle('active', link.dataset.id === id);
            });

            contentView.innerHTML = `
                <div class="article-header">
                    <h1>${article.title}</h1>
                    <div class="article-meta">
                        <span class="badge category">${article.category}</span>
                        ${article.tags.map(tag => `<span class="badge tag">#${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="article-body">
                    ${article.content}
                </div>
            `;
            contentView.scrollTop = 0;
        }

        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            const filtered = kbData.filter(article => {
                return (
                    article.title.toLowerCase().includes(searchTerm) ||
                    article.category.toLowerCase().includes(searchTerm) ||
                    article.tags.some(tag => tag.toLowerCase().includes(searchTerm)) ||
                    article.content.toLowerCase().includes(searchTerm)
                );
            });

            renderSidebar(filtered);
            
            if (filtered.length > 0) {
                displayArticle(filtered[0].id);
            } else {
                contentView.innerHTML = `
                    <h2>No matching playbook topics found</h2>
                    <p style="margin-top:0.5rem; color:#6b7280;">No results match your search parameters.</p>
                `;
            }
        });

        // REPOSITORY INITIALIZATION
        renderSidebar(kbData);
        if (kbData.length > 0) {
            displayArticle(kbData[0].id);
        }
    </script>
