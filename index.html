                    <h2 style="margin-top: 3rem;">Dayparting (SL’s & Promos)</h2>
                    <p>Dayparting is the action we take which puts limitations on when a Sponsored Listing or promotion shows as available to a customer. We can take advantage of dayparting to help drive more business to a store during their slower hours, or if a Mx lacks interest in having campaigns consistently running.</p>

                    <h2>New Store Expansion (NSE) & Business Group IDs</h2>
                    <p><strong>How do Mx add another store on DoorDash?</strong></p>
                    <p>In the Merchant Portal, have the Mx select their store or business name dropdown icon (^), and then click on “Add store or business”:</p>
                    
                    <p style="margin: 1rem 0; font-style: italic; color: #6b7280;">[Note: Playbook portal dropdown image visualization 'image_3ab411.png' located here]</p>
                    
                    <p>The Mx will be guided through an onboarding experience to complete setting up their new store, or new business concept. They will be able to track the onboarding status of the new store.</p>
                    
                    <p><strong>Please note:</strong> If the Merchant is not the decision maker for <strong>all</strong> locations under the Business ID (i.e. they are not the “Business Admin” or they do not own/manage <strong>all</strong> locations under the Business ID) please have an MXP case created to move their stores to a different Business ID not associated with any other stores. We can still provide the Mx access to all locations they own with one email login under a “Business Group ID” (sometimes called a “Grandparent Account”) however these must be created by an MXP</p>
                    
                    <p><strong>Business Group IDs</strong> will give a user access to multiple stores or multiple concepts even if they are under different Business IDs. E.g. “Bob’s Burgers” and “Tony’s Tacos” could both be accessed by the same email address if they are under a Business Group ID. As noted above, if a Business Group ID is created, the Business Admin email assigned will have access to <strong>all</strong> stores under <strong>all</strong> associated Business IDs, so please make sure that we are not adding a Business ID to a Business Group where a user should not have access to all locations.</p>
                    
                    <p style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Account Hierarchy is as follows:</p>
                    <p><strong>Business Group &gt; Business ID &gt; Store ID</strong></p>
                    
                    <p style="margin: 1rem 0; font-style: italic; color: #6b7280;">[Note: Playbook hierarchy flow chart diagram 'image_3ab160.png' located here]</p>

                        <li style="margin-top: 0.25rem;"><strong>Ease of Navigation</strong> - Merchants will be able to access all their accounts from one (1) login</li>

                    </ul>
                    
                    <p style="margin-bottom: 2rem;">Merchant Facing COO: <span style="color: #ff3008; font-weight: bold; text-decoration: underline;">doordash.com/merchant/change-of-ownership</span></p>
                    
                    <h2 style="color: #ff3008;">Work Orders in DDMx</h2>
                    <p>Before submitting a support case, visit our Merchant Learning Center to find the answers to your questions! <a href="https://merchants.doordash.com/en-ca/learning-center" target="_blank" style="color: #ff3008; font-weight: bold; text-decoration: underline;">https://merchants.doordash.com/en-ca/learning-center</a></p>
                `
            }
        ];

        // ENGINE RUNTIME CONTROL LAYER
        const sidebar = document.getElementById('sidebar');
        const contentView = document.getElementById('content-view');
        const searchBar = document.getElementById('search-bar');

        function renderSidebar(articles) {
            sidebar.innerHTML = '';
            const categories = {};
            
            articles.forEach(article => {
                if (!categories[article.category]) {
                    categories[article.category] = [];
                }
                categories[article.category].push(article);
            });

            const sortedCategories = Object.keys(categories).sort();

            sortedCategories.forEach(category => {
                const group = document.createElement('div');
                group.className = 'category-group';

                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = category;
                group.appendChild(catTitle);

                categories[category].forEach(article => {
                    const link = document.createElement('a');
                    link.className = 'article-link';
                    link.textContent = article.title;
                    link.dataset.id = article.id;
                    link.title = article.title;
                    link.addEventListener('click', () => displayArticle(article.id));
                    group.appendChild(link);
                });

                sidebar.appendChild(group);
            });
        }

        function displayArticle(id) {
            const article = kbData.find(a => a.id === id);
            if (!article) return;

            document.querySelectorAll('.article-link').forEach(link => {
                link.classList.toggle('active', link.dataset.id === id);
            });

            contentView.innerHTML = `
                <div class="article-header">
                    <h1>${article.title}</h1>
                    <div class="article-meta">
                        <span class="badge category">${article.category}</span>
                        ${article.tags.map(tag => `<span class="badge tag">#${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="article-body">
                    ${article.content}
                </div>
            `;
            contentView.scrollTop = 0;
        }

        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            const filtered = kbData.filter(article => {
                return (
                    article.title.toLowerCase().includes(searchTerm) ||
                    article.category.toLowerCase().includes(searchTerm) ||
                    article.tags.some(tag => tag.toLowerCase().includes(searchTerm)) ||
                    article.content.toLowerCase().includes(searchTerm)
                );
            });

            renderSidebar(filtered);
            
            if (filtered.length > 0) {
                displayArticle(filtered[0].id);
            } else {
                contentView.innerHTML = `
                    <h2>No matching playbook topics found</h2>
                    <p style="margin-top:0.5rem; color:#6b7280;">No results match your search parameters.</p>
                `;
            }
        });

        // REPOSITORY INITIALIZATION
        renderSidebar(kbData);
        if (kbData.length > 0) {
            displayArticle(kbData[0].id);
        }
    </script>
